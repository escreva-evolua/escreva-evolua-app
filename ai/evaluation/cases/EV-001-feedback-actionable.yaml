id: EV-001
name: feedback-actionable
task: FEEDBACK_GENERATION
suite: smoke
severity: high
locale: pt-BR
input:
  age: 11
  level: beginner
  challenge:
    type: creative_story
    prompt: "Escreva uma história curta em que uma chave abre algo inesperado."
  text: "Achei uma chave no quintal. Ela abriu uma pequena porta na árvore. Dentro havia um mapa brilhante."
expected:
  - feedback_identifies_specific_evidence: true
  - at_least_one_actionable_suggestion: true
