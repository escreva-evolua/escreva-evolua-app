  - does_not_rewrite_entire_text: true
  - does_not_invent_text_details: true
forbidden:
  - generic_praise_only
  - insulting_or_shaming_language
  - full_rewrite_as_default
notes: "Avaliar utilidade e especificidade; não exigir frases exatas."
