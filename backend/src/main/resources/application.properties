spring.application.name=escreva-evolua-backend
server.port=${SERVER_PORT:8080}
spring.mongodb.database=${MONGODB_DATABASE:escreva-evolua}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
identity.cognito.issuer=${COGNITO_ISSUER:}
identity.cognito.client-id=${COGNITO_APP_CLIENT_ID:}
identity.cognito.audience=${COGNITO_API_AUDIENCE:}
identity.cognito.user-info-url=${COGNITO_USER_INFO_URL:}
identity.cognito.region=${AWS_REGION:us-east-1}
identity.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
app.cors.origins=${FRONTEND_ORIGINS:}
identity.public-auth.rate-limit-per-minute=${IDENTITY_PUBLIC_AUTH_RATE_LIMIT_PER_MINUTE:10}

spring.mongodb.uri=${MONGODB_CONNECTION_STRING:mongodb://localhost:27017/escreva-evolua}
